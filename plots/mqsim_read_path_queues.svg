<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #4b5563; }
      .lane-title { font-size: 18px; font-weight: 700; fill: #374151; }
      .box-title { font-size: 20px; font-weight: 700; }
      .box-text { font-size: 15px; fill: #374151; }
      .arrow-text { font-size: 14px; fill: #374151; }
      .kernel-lane { fill: #eaf6ff; stroke: #8ecae6; }
      .daemon-lane { fill: #fff7e6; stroke: #f4c06a; }
      .mqsim-lane { fill: #ecfdf3; stroke: #93d7aa; }
      .kernel-box { fill: #dff1ff; stroke: #1687c9; }
      .daemon-box { fill: #fff0c7; stroke: #d88a00; }
      .mqsim-box { fill: #dcfce7; stroke: #16a34a; }
      .line { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin { stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="70" y="70" class="title">NVMeVirt + MQSim Read Path and Internal Queues</text>
  <text x="70" y="102" class="subtitle">Current online/native path: DiskANN read request enters NVMeVirt, asks MQSim daemon for latency, then NVMeVirt completes the request at the simulated time.</text>

  <rect x="60" y="135" width="365" height="670" rx="12" class="kernel-lane"/>
  <rect x="455" y="135" width="270" height="670" rx="12" class="daemon-lane"/>
  <rect x="755" y="135" width="785" height="670" rx="12" class="mqsim-lane"/>

  <text x="90" y="172" class="lane-title">Kernel space</text>
  <text x="485" y="172" class="lane-title">User space daemon</text>
  <text x="785" y="172" class="lane-title">MQSim native online model</text>

  <rect x="105" y="225" width="275" height="95" rx="10" class="kernel-box" stroke-width="2"/>
  <text x="135" y="260" class="box-title">DiskANN / block read</text>
  <text x="135" y="288" class="box-text">Read request reaches NVMeVirt</text>

  <rect x="105" y="400" width="275" height="125" rx="10" class="kernel-box" stroke-width="2"/>
  <text x="135" y="435" class="box-title">NVMeVirt MQSim IPC</text>
  <text x="135" y="463" class="box-text">Send opcode, SLBA, NLB</text>
  <text x="135" y="486" class="box-text">Wait for latency reply</text>

  <rect x="105" y="650" width="275" height="95" rx="10" class="kernel-box" stroke-width="2"/>
  <text x="135" y="685" class="box-title">NVMeVirt completion</text>
  <text x="135" y="713" class="box-text">Complete kernel request</text>

  <rect x="500" y="400" width="180" height="125" rx="10" class="daemon-box" stroke-width="2"/>
  <text x="527" y="435" class="box-title">MQSim IPC</text>
  <text x="527" y="463" class="box-title">Daemon</text>
  <text x="527" y="491" class="box-text">Shared-memory rings</text>

  <rect x="800" y="220" width="310" height="120" rx="10" class="mqsim-box" stroke-width="2"/>
  <text x="830" y="255" class="box-title">Online request injection</text>
  <text x="830" y="283" class="box-text">Daemon calls MQSim directly</text>
  <text x="830" y="306" class="box-text">Bypasses full SQ fetch path</text>

  <rect x="1180" y="220" width="310" height="120" rx="10" class="mqsim-box" stroke-width="2"/>
  <text x="1210" y="255" class="box-title">NVMe host queue model</text>
  <text x="1210" y="283" class="box-text">Submission / completion queue</text>
  <text x="1210" y="306" class="box-text">capacity exposed by MQSim</text>

  <rect x="800" y="420" width="310" height="120" rx="10" class="mqsim-box" stroke-width="2"/>
  <text x="830" y="455" class="box-title">FTL address mapping</text>
  <text x="830" y="483" class="box-text">Translate LBA/LPN to PPA</text>
  <text x="830" y="506" class="box-text">May issue mapping reads</text>

  <rect x="1180" y="420" width="310" height="150" rx="10" class="mqsim-box" stroke-width="2"/>
  <text x="1210" y="455" class="box-title">TSU transaction queues</text>
  <text x="1210" y="483" class="box-text">User read/write queues</text>
  <text x="1210" y="506" class="box-text">Mapping and GC queues</text>
  <text x="1210" y="529" class="box-text">Main backend queueing point</text>

  <rect x="800" y="660" width="310" height="115" rx="10" class="mqsim-box" stroke-width="2"/>
  <text x="830" y="695" class="box-title">PHY waiting queues</text>
  <text x="830" y="723" class="box-text">Wait after TSU dispatch</text>
  <text x="830" y="746" class="box-text">Before channel service</text>

  <rect x="1180" y="660" width="310" height="115" rx="10" class="mqsim-box" stroke-width="2"/>
  <text x="1210" y="695" class="box-title">Channel / chip / die timing</text>
  <text x="1210" y="723" class="box-text">Issue command to target die</text>
  <text x="1210" y="746" class="box-text">Die stays busy until finish event</text>

  <path class="line" d="M242 320 L242 395"/>
  <path class="line" d="M380 445 L495 445"/>
  <text x="395" y="423" class="arrow-text">request metadata</text>

  <path class="line" d="M680 435 C735 375, 742 286, 795 280"/>
  <text x="650" y="342" class="arrow-text">submit to MQSim</text>

  <path class="line" d="M1110 280 L1175 280"/>
  <text x="1118" y="210" class="arrow-text">host queue model</text>

  <path class="line" d="M955 340 L955 415"/>
  <text x="974" y="384" class="arrow-text">request enters FTL</text>

  <path class="line" d="M1110 480 L1175 492"/>
  <text x="1110" y="410" class="arrow-text">flash transactions</text>

  <path class="line" d="M1335 570 L1335 655"/>
  <text x="1354" y="618" class="arrow-text">dispatch</text>

  <path class="line" d="M1180 717 L1115 717"/>
  <text x="1128" y="696" class="arrow-text">dequeue</text>

  <path class="line thin" d="M800 717 C635 725, 590 630, 590 530"/>
  <text x="620" y="690" class="arrow-text">simulated completion time</text>

  <path class="line" d="M500 485 L385 485"/>
  <text x="405" y="513" class="arrow-text">latency reply</text>

  <path class="line" d="M242 525 L242 645"/>
</svg>
