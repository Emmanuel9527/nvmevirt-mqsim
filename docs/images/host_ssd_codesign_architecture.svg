<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="503" viewBox="0 0 1048 503" role="img" aria-labelledby="title desc">
  <title id="title">Host–SSD codesign architecture</title>
  <desc id="desc">Host CPU and DRAM connect to SSD controllers C0 to C2 and C3. C3 works with NAND, iDMA, DSP, DLM, and DBuf.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,4 L8,8 z" fill="#111"/></marker>
    <style>
      text { font-family: Arial, "Noto Sans", sans-serif; fill: #111; }
      .outer-host { fill: #99cfea; stroke: #111; stroke-width: 2.5; }
      .outer-ssd { fill: #dedede; stroke: #111; stroke-width: 2.5; }
      .host-box { fill: #35aeef; stroke: #111; stroke-width: 2.5; }
      .ssd-box, .unit { fill: #bdbdbd; stroke: #111; stroke-width: 2.5; }
      .title { font-size: 21px; font-weight: 700; }
      .box-title { font-size: 20px; font-weight: 700; }
      .body { font-size: 15.5px; }
      .wire { fill: none; stroke: #111; stroke-width: 2.2; marker-start: url(#arrowStart); marker-end: url(#arrow); }
      .dotted { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; marker-start: url(#arrowStart); marker-end: url(#arrow); }
      .single-dotted { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="title" x="24" y="28">Host Machine</text>
  <text class="title" x="447" y="24">SSD</text>
  <rect class="outer-host" x="15" y="43" width="329" height="428" rx="29"/>
  <rect class="outer-ssd" x="436" y="41" width="602" height="455" rx="30"/>

  <!-- Interconnects -->
  <path class="wire" d="M174 231 V291"/>
  <text class="body" x="183" y="266">Bus</text>
  <path class="dotted" d="M321 104 H455"/>
  <path class="dotted" d="M321 178 H455"/>
  <path class="wire" d="M706 102 H790"/>
  <path class="wire" d="M579 352 V402"/>
  <path class="single-dotted" d="M706 195 H748 V278 H834 V316"/>
  <path class="dotted" d="M900 280 V312"/>
  <path class="wire" d="M916 214 V407"/>
  <path class="wire" d="M769 437 H797"/>
  <path class="wire" d="M876 437 H915"/>

  <!-- Host -->
  <rect class="host-box" x="33" y="72" width="287" height="159" rx="29"/>
  <text class="box-title" x="61" y="102">Host CPU</text>
  <text class="body" x="59" y="129">
    <tspan x="59" dy="0">• Compute PQ distance</tspan>
    <tspan x="59" dy="22">• Maintain visited set and frontier</tspan>
    <tspan x="59" dy="22">• Select nodes to expand</tspan>
    <tspan x="59" dy="22">• Maintain exact top-k and update</tspan>
    <tspan x="75" dy="19">threshold</tspan>
  </text>
  <rect class="host-box" x="33" y="292" width="287" height="159" rx="29"/>
  <text class="box-title" x="61" y="323">Host DRAM</text>
  <text class="body" x="59" y="350">
    <tspan x="59" dy="0">• PQ codes for all vectors</tspan>
    <tspan x="59" dy="22">• Query-based LUT</tspan>
    <tspan x="59" dy="22">• Visited set</tspan>
    <tspan x="59" dy="22">• Candidate list</tspan>
    <tspan x="59" dy="22">• Result list</tspan>
  </text>

  <!-- SSD -->
  <rect class="ssd-box" x="455" y="63" width="251" height="78" rx="33"/>
  <text class="box-title" x="477" y="91">SSD Controller (C0~C2)</text>
  <text class="body" x="478" y="116">• Normal SSD I/O management</text>

  <rect class="ssd-box" x="455" y="154" width="251" height="198" rx="34"/>
  <text class="box-title" x="477" y="183">SSD Controller (C3)</text>
  <text class="body" x="478" y="209">
    <tspan x="478" dy="0">• Submit internal reads</tspan>
    <tspan x="478" dy="22">• Parse nodes and return</tspan>
    <tspan x="494" dy="19">neighbor id to host</tspan>
    <tspan x="478" dy="22">• Schedule iDMA and DSP</tspan>
    <tspan x="478" dy="22">• Manage buffer and return</tspan>
    <tspan x="494" dy="19">qualified results</tspan>
  </text>

  <rect class="ssd-box" x="790" y="63" width="226" height="217" rx="33"/>
  <text class="box-title" x="815" y="96">Nand Flash logic</text>
  <text class="body" x="817" y="130">
    <tspan x="817" dy="0">• neighbor lists</tspan>
    <tspan x="817" dy="24">• full vector</tspan>
  </text>

  <rect class="ssd-box" x="455" y="402" width="314" height="78" rx="34"/>
  <text class="box-title" x="477" y="431">DSP</text>
  <text class="body" x="478" y="451">
    <tspan x="478" dy="0">• Compute exact distance (L2)</tspan>
    <tspan x="478" dy="20">• Filter results using top-k threshold</tspan>
  </text>

  <rect class="unit" x="797" y="407" width="79" height="62" rx="30"/>
  <text class="box-title" x="807" y="445">DLM</text>
  <rect class="unit" x="915" y="407" width="80" height="62" rx="30"/>
  <text class="box-title" x="925" y="445">DBuf</text>
  <rect class="unit" x="790" y="316" width="88" height="47" rx="24"/>
  <text class="box-title" x="803" y="347">iDMA</text>
</svg>
